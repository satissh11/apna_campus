<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Smart Campus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            background: linear-gradient(-45deg, #1c92d2, #6dd5ed, #ff416c, #ff4b2b);
            background-size: 400% 400%;
            animation: bgMove 15s ease infinite;
        }

        /* 🔹 Text animations */
        h1 {
            font-size: 3em;
            text-shadow: 0 0 25px rgba(0,0,0,0.6);
            animation: fadeIn 2s ease forwards;
        }

        p {
            font-size: 1.2em;
            margin-top: 20px;
            text-shadow: 0 0 15px rgba(0,0,0,0.6);
            opacity:0;
            animation: fadeIn 2s 0.7s ease forwards;
        }

        /* 🔹 Logo bounce + glow */
        img {
            width: 150px;
            margin-top: 30px;
            animation: bounce 2s infinite, glow 2s alternate infinite;
        }

        @keyframes bgMove {
            0% {background-position:0% 50%;}
            50% {background-position:100% 50%;}
            100% {background-position:0% 50%;}
        }

        @keyframes fadeIn {
            from {opacity:0; transform:translateY(50px);}
            to {opacity:1; transform:translateY(0);}
        }

        @keyframes bounce {
            0%, 100% {transform: translateY(0);}
            50% {transform: translateY(-20px);}
        }

        @keyframes glow {
            0% {filter: drop-shadow(0 0 5px #fff);}
            50% {filter: drop-shadow(0 0 25px #ff4b2b);}
            100% {filter: drop-shadow(0 0 5px #fff);}
        }

        /* 🔹 Floating particles */
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            opacity:0.6;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {transform: translateY(100vh);}
            100% {transform: translateY(-50px);}
        }
    </style>
</head>
<body onclick="goToSearch()">

    <!-- Welcome text + logo -->
    <div>
        <h1>Welcome to Sarala Birla University</h1>
        <p>Tap anywhere to start Smart Campus Navigation 🔍</p>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Error" style="width:120px; height:auto; margin-bottom:20px;">

    </div>

    <!-- Floating particles -->
    <div class="particle" style="left:5%; animation-duration:6s;"></div>
    <div class="particle" style="left:20%; animation-duration:8s;"></div>
    <div class="particle" style="left:40%; animation-duration:7s;"></div>
    <div class="particle" style="left:60%; animation-duration:5s;"></div>
    <div class="particle" style="left:80%; animation-duration:9s;"></div>

    <script>
        // 🔔 Alert on page load
        alert("Welcome to Smart Campus Navigation!");

        // Click anywhere → search page
        function goToSearch(){
            window.location.href = "/searchpage";
        }
    </script>
</body>
</html>
