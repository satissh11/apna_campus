<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarala Birla University — Smart Campus</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: #06060f;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* ── DYNAMIC GLOW BACKDROP ── */
        .glow-canvas {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: float 14s ease-in-out infinite;
        }
        .g1 { width: 500px; height: 500px; background: #ff416c; top: -100px; left: -100px; }
        .g2 { width: 450px; height: 450px; background: #6dd5ed; bottom: -80px; right: -80px; animation-delay: -4s; }
        .g3 { width: 300px; height: 300px; background: #a855f7; top: 40%; left: 35%; animation-delay: -8s; }
        @keyframes float {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(30px,-20px) scale(1.05); }
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* ── LOGO WRAPPER ── */
        .logo-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        .sbu-logo {
            max-width: 280px;
            height: auto;
            border-radius: 20px;
            filter: drop-shadow(0 15px 45px rgba(255, 65, 108, 0.3));
            animation: pulseGlow 3s ease-in-out infinite;
            margin-bottom: 24px;
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        body:hover .sbu-logo {
            transform: scale(1.03);
            filter: drop-shadow(0 20px 50px rgba(255, 65, 108, 0.45));
        }

        @keyframes pulseGlow {
            0%, 100% {
                filter: drop-shadow(0 15px 45px rgba(255, 65, 108, 0.3));
            }
            50% {
                filter: drop-shadow(0 20px 60px rgba(109, 213, 237, 0.45));
            }
        }

        .enter-txt {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
            animation: blink 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body onclick="window.location.href='/searchpage'">

    <div class="glow-canvas">
        <div class="glow g1"></div>
        <div class="glow g2"></div>
        <div class="glow g3"></div>
    </div>
    <div class="grid-overlay"></div>

    <div class="logo-container">
        <!-- Render SBU Logo from static folder -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Sarala Birla University Logo" class="sbu-logo">
        <div class="enter-txt">Tap anywhere to enter</div>
    </div>

</body>
</html>
